<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Purchase Confirmed | By The People RolePlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.successPage{min-height:100vh;display:grid;place-items:center;padding:30px 18px;background:radial-gradient(circle at 20% 20%,rgba(0,80,255,.12),transparent 35%),radial-gradient(circle at 80% 60%,rgba(255,0,25,.13),transparent 35%),#050a12}
.successCard{width:min(720px,100%);background:rgba(8,17,30,.96);border:1px solid #29456c;box-shadow:0 25px 80px rgba(0,0,0,.45);padding:38px;border-radius:4px}
.successBrand{text-align:center;margin-bottom:30px}.successBrand .brandMark{margin:0 auto 12px}.successBrand .brandWords{display:block}
.successTick{width:76px;height:76px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;background:#0d1d31;border:2px solid #20c878;color:#20c878;font-size:38px;font-weight:900}
.successKicker{text-align:center;color:#ff2845;font-size:11px;font-weight:900;letter-spacing:4px}
.successTitle{text-align:center;font:700 clamp(42px,8vw,70px)/.95 Oswald;margin:9px 0 16px}
.successIntro{text-align:center;color:#aeb8c8;line-height:1.7;max-width:560px;margin:0 auto 30px}
.purchaseIdBox{border:1px solid #ff2845;background:#07101d;padding:20px;text-align:center;margin:25px 0}
.purchaseIdBox small{display:block;color:#aeb8c8;font-size:10px;font-weight:900;letter-spacing:3px}
.purchaseIdBox strong{display:block;margin-top:8px;color:#fff;font-size:25px;letter-spacing:1px;word-break:break-all}
.orderRows{border-top:1px solid #26364e}
.orderRow{display:flex;justify-content:space-between;gap:20px;padding:16px 0;border-bottom:1px solid #26364e}
.orderRow span:first-child{color:#cbd5e1}.orderRow span:last-child{text-align:right;font-weight:800}
.orderTotal{font-size:18px}.orderStatus{color:#20c878}
.deliveryBox{margin:25px 0;padding:18px;border:1px solid #26364e;background:#07101d;color:#cbd5e1;line-height:1.65}
.emailNote{text-align:center;color:#8492a6;font-size:12px;margin:18px 0 25px}
.successActions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.successActions .primary{min-width:220px}
.secondaryBtn{display:inline-flex;align-items:center;justify-content:center;padding:17px 22px;border:1px solid #385276;color:#fff;text-decoration:none;font-size:12px;font-weight:900;letter-spacing:1.5px;background:#07101d}
@media(max-width:600px){.successCard{padding:25px 18px}.successTitle{font-size:48px}.orderRow{font-size:13px}.purchaseIdBox strong{font-size:20px}}
</style>
</head>
<body>
<main class="successPage">
  <section class="successCard" id="successCard">
    <div class="successBrand">
      <span class="brandMark">★</span>
      <span class="brandWords">BY THE PEOPLE<small>ROLEPLAY</small></span>
    </div>
    <div class="successTick">✓</div>
    <div class="successKicker">OFFICIAL STORE</div>
    <h1 class="successTitle">PURCHASE CONFIRMED</h1>
    <p class="successIntro" id="intro">Checking your payment and preparing your purchase confirmation...</p>
    <div id="orderArea"></div>
  </section>
</main>
<script>
const money = n => new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(Number(n)||0);
const esc = v => String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params = new URLSearchParams(location.search);
const sessionId = params.get('session_id');
const intro = document.querySelector('#intro');
const area = document.querySelector('#orderArea');

function showError(message){
  intro.textContent = message;
  area.innerHTML = `<div class="deliveryBox">If you have been charged, please keep your Stripe receipt and contact By The People RolePlay support.</div>
    <div class="successActions"><a class="primary" href="/">RETURN TO STORE →</a></div>`;
}

async function loadOrder(){
  if(!sessionId){ showError('We could not find your Stripe checkout session.'); return; }
  try{
    const response = await fetch('/api/order/' + encodeURIComponent(sessionId),{cache:'no-store'});
    const data = await response.json();
    if(!response.ok) throw new Error(data.error || 'Order could not be confirmed.');

    intro.innerHTML = `Thank you for your purchase, <strong>${esc(data.name)}</strong>. Your payment has been successfully completed.`;

    const rows = data.products.map(p => `<div class="orderRow"><span>${esc(p.name)}</span><span>${money(p.price)}${p.billing==='monthly' ? '/month' : ''}</span></div>`).join('');
    area.innerHTML = `
      <div class="purchaseIdBox">
        <small>PURCHASE ID</small>
        <strong>${esc(data.purchaseId)}</strong>
      </div>
      <div class="orderRows">
        ${rows}
        <div class="orderRow orderTotal"><span>TOTAL</span><span>${money(data.total)}${data.billing==='monthly' ? '/month' : ''}</span></div>
        <div class="orderRow"><span>PAYMENT</span><span class="orderStatus">✓ COMPLETED</span></div>
      </div>
      <div class="deliveryBox">
        <strong>DELIVERY</strong><br>
        Your purchase has been recorded for By The People RolePlay.
        In-game delivery will be available once your FiveM account is linked and the delivery resource is connected.
      </div>
      <div class="emailNote">${data.email ? `A confirmation email has been sent to <strong>${esc(data.email)}</strong>.` : 'Your payment confirmation is available above.'}<br>Please keep your Purchase ID for support enquiries.</div>
      <div class="successActions">
        <a class="primary" href="/">RETURN TO STORE →</a>
      </div>`;
  }catch(error){
    console.error(error);
    showError(error.message || 'We could not confirm your order.');
  }
}
loadOrder();
</script>
</body>
</html>
